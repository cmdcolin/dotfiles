unbind C-b
set -g prefix C-]
bind C-] send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 0
set -g mouse on
set -g history-limit 50000

setw -g mode-keys vi

bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n M-Left previous-window
bind -n M-Right next-window

# Copy reaches the clipboard of the machine you're sitting at, over ssh too:
# tmux sends OSC 52 to the outer terminal. `on` (not the default `external`)
# is needed for a local tmux to relay a nested remote tmux's sequence.
set -g set-clipboard on
set -as terminal-features ",*:clipboard"

# if-shell, not %if — #() is empty while the config parses, so a %if here
# always silently takes the else branch.
if-shell 'uname -s | grep -q Darwin' \
  'set -g @copy "pbcopy"' \
  'set -g @copy "xclip -in -selection clipboard 2>/dev/null"'

bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy}"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy}"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy}"
