unbind C-b
set -g prefix C-]
bind C-] send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -sg escape-time 0
set -g mouse on
set -g history-limit 50000

setw -g mode-keys vi

bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n M-Left previous-window
bind -n M-Right next-window

# Copy reaches the clipboard of the machine you're sitting at, over ssh too:
# tmux sends OSC 52 to the outer terminal. `on` (not the default `external`)
# is needed for a local tmux to relay a nested remote tmux's sequence.
set -g set-clipboard on
# tmux's default table grants neither to xterm*, so it would strip OSC 52 and
# OSC 8 hyperlinks instead of passing them to the outer terminal.
set -as terminal-features ",*:clipboard:hyperlinks"

# if-shell, not %if — #() is empty while the config parses, so a %if here
# always silently takes the else branch.
if-shell 'uname -s | grep -q Darwin' \
  'set -g @copy "pbcopy"' \
  'set -g @copy "xclip -in -selection clipboard 2>/dev/null"'

bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy}"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy}"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy}"

set -g status-position top
set -g status-interval 5
set -g status-style "bg=colour236,fg=colour250"
set -g status-left ""
set -g status-right "#[range=user|dispatch] dispatch #[norange]  #S "
set -g status-right-style "fg=colour244"
set -g window-status-separator ""
set -g window-status-format "  #I #{b:pane_current_path}  "
set -g window-status-current-format "  #I #{b:pane_current_path}  "
set -g window-status-current-style "bg=colour31,fg=colour255,bold"
set -g window-status-activity-style "fg=colour214"
setw -g monitor-activity on
set -g visual-activity off
set -g bell-action none
setw -g monitor-bell off

bind -n IC if -F '#{==:#{session_name},dispatch}' 'detach-client' 'display-popup -E -w 90% -h 85% "env TMUX= tmux attach -t dispatch"'
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},dispatch}' \
  'display-popup -E -w 90% -h 85% "env TMUX= tmux attach -t dispatch"' \
  'select-window -t ='
