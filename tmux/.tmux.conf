unbind C-b
set -g prefix C-]
bind C-] send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 0
set -g mouse on
set -g history-limit 50000

setw -g mode-keys vi

bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n M-Left previous-window
bind -n M-Right next-window

# Copying also emits OSC 52 to the outer terminal, so a tmux on a remote box
# (labserver) lands text in the *local* clipboard with no X11 or xclip.
# `on` rather than the default `external` is what makes a local tmux relay a
# nested remote tmux's sequence instead of swallowing it.
set -g set-clipboard on
set -as terminal-features ",*:clipboard"

# if-shell, not %if: `#(uname -s)` evaluates to empty during config parsing, so
# the Darwin branch of a %if never ran and mac silently got the xclip binding.
if-shell 'uname -s | grep -q Darwin' \
  'set -g @copy "pbcopy"' \
  'set -g @copy "xclip -in -selection clipboard 2>/dev/null"'

bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy}"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy}"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy}"
