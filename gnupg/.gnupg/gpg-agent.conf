# Cache the passphrase for ~400 days so signing effectively only prompts once
# per agent restart (reboot). default-cache-ttl resets on each use; max-cache-ttl
# is the absolute lifetime from when it was entered.
default-cache-ttl 34560000
max-cache-ttl 34560000

# Session-aware pinentry wrapper (GUI popup when there's a display, inline tty
# prompt in tmux/ssh instead of a full-screen ncurses box). gpg-agent.conf does
# not expand ~ or $HOME, so this must be an absolute path.
pinentry-program /home/cdiesh/.local/bin/pinentry-auto
